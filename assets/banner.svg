<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="50%" stop-color="#3a7bd5" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#00f2fe" flood-opacity="0.15" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 38px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 16px;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: #38bdf8;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: #e2e8f0;
    }

    /* Subtle Animated Pulse for Background Elements */
    @keyframes pulseRing {
      0% { r: 55px; opacity: 0.6; }
      50% { r: 85px; opacity: 0.15; }
      100% { r: 55px; opacity: 0.6; }
    }
    @keyframes pulseRing2 {
      0% { r: 70px; opacity: 0.4; }
      50% { r: 110px; opacity: 0.1; }
      100% { r: 70px; opacity: 0.4; }
    }
    @keyframes floatPill1 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
      100% { transform: translateY(0px); }
    }
    @keyframes floatPill2 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(7px); }
      100% { transform: translateY(0px); }
    }
    @keyframes dashStream {
      to { stroke-dashoffset: -40; }
    }

    .pulsing-orb {
      animation: pulseRing 5s ease-in-out infinite;
    }
    .pulsing-orb-2 {
      animation: pulseRing2 6s ease-in-out infinite;
    }
    .stream-line {
      stroke-dasharray: 6 6;
      animation: dashStream 3s linear infinite;
    }
    .pill-float-1 {
      animation: floatPill1 4s ease-in-out infinite;
    }
    .pill-float-2 {
      animation: floatPill2 4.5s ease-in-out infinite;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="2" />

  <!-- Animated Decorative Background Flows (Stay in Background) -->
  <g opacity="0.35">
    <path class="stream-line" d="M 50 80 Q 300 20 600 90 T 1150 70" fill="none" stroke="#0ea5e9" stroke-width="2" />
    <path class="stream-line" d="M 50 300 Q 400 340 750 280 T 1150 310" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="1060" cy="180" r="70" fill="none" stroke="#38bdf8" stroke-width="1.5" class="pulsing-orb" />
    <circle cx="1060" cy="180" r="95" fill="none" stroke="#818cf8" stroke-width="1" class="pulsing-orb-2" />
  </g>

  <!-- Side Diagram Graphic (Right side, clear of text) -->
  <g transform="translate(920, 70)" filter="url(#card-shadow)">
    <!-- Globe/Residency Node -->
    <rect x="0" y="0" width="230" height="210" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" opacity="0.9" />
    <circle cx="115" cy="85" r="42" fill="#0284c7" opacity="0.15" />
    <circle cx="115" cy="85" r="30" fill="#0284c7" opacity="0.3" />
    
    <!-- Shield Icon in Central Node -->
    <path d="M 115 65 L 133 73 V 87 C 133 99 125 109 115 113 C 105 109 97 99 97 87 V 73 Z" fill="#38bdf8" opacity="0.9" />
    <path d="M 115 67 L 115 111 C 123 107 131 98 131 87 V 74 Z" fill="#ffffff" opacity="0.4" />
    
    <!-- Boundary Pill 1 (Dynamic Float) -->
    <g class="pill-float-1" transform="translate(20, 145)">
      <rect width="90" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <text x="45" y="18" text-anchor="middle" class="pill-text" font-size="11">🛡️ GDPR/EU</text>
    </g>

    <!-- Boundary Pill 2 (Dynamic Float) -->
    <g class="pill-float-2" transform="translate(120, 145)">
      <rect width="90" height="28" rx="14" fill="#1e293b" stroke="#34d399" stroke-width="1" />
      <text x="45" y="18" text-anchor="middle" class="pill-text" font-size="11">🇮🇳 DPDPA/RBI</text>
    </g>
  </g>

  <!-- Foreground Header & Content Elements -->
  <!-- Tag / Pill -->
  <g transform="translate(60, 50)">
    <rect width="280" height="32" rx="16" fill="#0369a1" fill-opacity="0.25" stroke="#0284c7" stroke-width="1" />
    <circle cx="16" cy="16" r="4" fill="#38bdf8" filter="url(#glow)" />
    <text x="30" y="21" class="badge-text">GLOBAL SOVEREIGNTY &amp; AUDITS</text>
  </g>

  <!-- Main Title -->
  <text x="60" y="130" class="title-text">
    Foreign Data Localization
  </text>
  <text x="60" y="178" class="title-text" fill="url(#accent-grad)">
    Compliance Audits Ecosystem
  </text>

  <!-- Subtitle -->
  <text x="60" y="222" class="subtitle-text">
    Curated SaaS Platforms, Policy-as-Code Engines &amp; Open-Source Residency Guardrails
  </text>
  <text x="60" y="248" class="subtitle-text" fill="#64748b" font-size="14px">
    Enforcing territorial boundaries, cross-border cryptographic controls, and verifiable audit evidence.
  </text>

  <!-- Feature Pills / Highlights in Foreground -->
  <g transform="translate(60, 280)">
    <!-- Pill 1 -->
    <g>
      <rect width="170" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="85" y="22" text-anchor="middle" class="pill-text">🌐 Data Residency</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(185, 0)">
      <rect width="180" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="90" y="22" text-anchor="middle" class="pill-text">⚖️ Cross-Border Audits</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(380, 0)">
      <rect width="175" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="87" y="22" text-anchor="middle" class="pill-text">📜 Policy as Code</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(570, 0)">
      <rect width="175" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="87" y="22" text-anchor="middle" class="pill-text">🔒 Sovereign Vaults</text>
    </g>
  </g>
</svg>
